services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novelweb
      POSTGRES_PASSWORD: novelweb
      POSTGRES_DB: novelweb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      # Override để trỏ vào service trong cùng network thay vì localhost
      DATABASE_URL: postgresql://novelweb:novelweb@postgres:5432/novelweb
      REDIS_URL: redis://redis:6379
      PORT: 8000
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
