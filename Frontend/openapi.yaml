          $ref: '#/components/responses/Unauthorized'

  /payments/orders/{id}:
    get:
      tags: [Payments]
      summary: Lấy chi tiết đơn hàng
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID của đơn hàng
      responses:
        '200':
          description: Chi tiết đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/webhook:
    post:
      tags: [Payments]
      summary: SePay webhook — nhận thông báo chuyển khoản thành công
      description: |
        Endpoint nhận webhook từ SePay khi có giao dịch chuyển khoản vào.

        **Flow xử lý:**
        1. Kiểm tra `transferType === "in"` — bỏ qua nếu là "out"
        2. Kiểm tra idempotency: `gatewayTransactionId` (`id` field) phải chưa tồn tại trong `sepay_webhook_logs`
        3. Tìm `payment_orders` có `orderCode = referenceCode` và `status = PENDING`
        4. Kiểm tra `transferAmount >= order.amountVnd`
        5. Trong 1 DB transaction: cộng candy vào `user_wallets`, tạo `wallet_transactions`, cập nhật `payment_orders.status = COMPLETED`, lưu `sepay_webhook_logs`
        6. Tạo notification cho user

        **Idempotency:** `sepay_webhook_logs.gatewayTransactionId` có UNIQUE constraint — lần xử lý thứ 2 sẽ throw và rollback.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SepayWebhookRequest'
      responses:
        '200':
          description: Webhook đã được xử lý
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Payload không hợp lệ hoặc đơn hàng không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

