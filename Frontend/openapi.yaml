      tags: [Payments]
      summary: Tạo đơn hàng nạp candy
      description: |
        Tạo đơn hàng và sinh `orderCode` duy nhất.
        User chuyển khoản với nội dung chứa `orderCode` để SePay tự động match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentOrderRequest'
      responses:
