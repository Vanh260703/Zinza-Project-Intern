openapi: 3.0.3
info:
  title: TruyệnHay API
  description: |
    Backend API cho nền tảng đọc truyện TruyệnHay — NestJS + PostgreSQL.

    **Authentication:**
    - JWT access token (15 phút), gửi qua httpOnly cookie hoặc Authorization header
    - Refresh token lưu trong Redis (7 ngày)

    **Business rules:**
    - `users.recommendationTicket` = vé đề cử tích lũy
    - `user_wallets.balance` = số dư candy (bảng tách riêng tránh race condition)
    - `stories.candyReceived` = tổng candy truyện đã nhận (KHÔNG phải giá)
    - `chapters.price` = số candy cần để mở khoá (0 = miễn phí)
    - `story_nominations` UNIQUE(user_id, story_id) = mỗi user chỉ đề cử 1 lần / 1 truyện
    - `payment_orders.orderCode` = mã user ghi vào nội dung chuyển khoản để SePay match
    - `sepay_webhook_logs.gatewayTransactionId` UNIQUE = idempotency key
  version: 1.0.0
  contact:
    name: TruyệnHay Dev Team

servers:
  - url: http://localhost:4000/api
    description: Local NestJS development
  - url: https://api.truyenhay.com/api
    description: Production

tags:
  - name: Auth
    description: Đăng ký, đăng nhập, refresh token, đăng xuất
  - name: Users
    description: Hồ sơ người dùng, ví candy, bookmark, thông báo
  - name: Stories
    description: Quản lý truyện, đánh giá, bình luận, đề cử
  - name: Chapters
    description: Quản lý chương truyện và mở khoá chương VIP
  - name: Taxonomy
    description: Thể loại (categories) và tag
  - name: Payments
    description: Gói nạp candy, đơn hàng, webhook SePay
  - name: Admin
    description: Quản trị hệ thống — **yêu cầu role ADMIN**

# ─── SECURITY ─────────────────────────────────────────────────────────────────

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 phút). Lấy từ POST /auth/login hoặc POST /auth/refresh.

  # ─── SCHEMAS ────────────────────────────────────────────────────────────────

  schemas:

    # ── Enums ──

    UserRole:
      type: string
      enum: [USER, ADMIN]
      example: USER

    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]
      example: MALE

    StoryStatus:
      type: string
      enum: [PENDING, COMPLETED]
      description: PENDING = đang ra, COMPLETED = hoàn thành
      example: PENDING

    WalletTransactionType:
      type: string
      enum: [TOPUP, SPEND, REFUND, BONUS]
      example: TOPUP

    NotificationType:
      type: string
      enum: [NEW_CHAPTER, NEW_COMMENT, PAYMENT_SUCCESS, SYSTEM]
      example: PAYMENT_SUCCESS

    PaymentOrderStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, EXPIRED]
      example: PENDING

    # ── Core entities ──

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Nguyễn Văn A
        gender:
          $ref: '#/components/schemas/Gender'
        role:
          $ref: '#/components/schemas/UserRole'
        avatarUrl:
          type: string
          nullable: true
          example: https://cdn.truyenhay.com/avatars/a1b2c3d4.jpg
        chaptersRead:
          type: integer
          example: 42
        recommendationTicket:
          type: integer
          description: Số vé đề cử hiện có
          example: 3
        dailyReadCount:
          type: integer
          description: Số chương đã đọc hôm nay
          example: 7
        dailyReadDate:
          type: string
          format: date
          nullable: true
          example: "2026-06-16"
        dailyTicketClaimed:
          type: boolean
          description: Đã nhận vé đề cử hôm nay chưa
          example: false
        joinedAt:
          type: string
          format: date-time
          example: "2024-01-15T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, email, name, role, chaptersRead, recommendationTicket, dailyReadCount, dailyTicketClaimed, joinedAt]

    WalletResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: w1b2c3d4-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        balance:
          type: integer
          description: Số dư candy hiện tại
          example: 150
        totalDeposited:
          type: integer
          description: Tổng candy đã nạp
          example: 500
        totalSpent:
          type: integer
          description: Tổng candy đã tiêu
          example: 350
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, userId, balance, totalDeposited, totalSpent]

    WalletTransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: t1b2c3d4-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: integer
          description: Số candy thay đổi (dương = nhận, âm = tiêu)
          example: 100
        balanceBefore:
          type: integer
          description: Số dư trước giao dịch
          example: 50
        balanceAfter:
          type: integer
          description: Số dư sau giao dịch
          example: 150
        description:
          type: string
          nullable: true
          example: Nạp candy từ gói 100,000đ
        referenceId:
          type: string
          format: uuid
          nullable: true
          description: ID của đơn hàng hoặc chapter liên quan
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, userId, type, amount, balanceBefore, balanceAfter, createdAt]

    StorySummary:
      type: object
      description: Thông tin tóm tắt truyện dùng trong danh sách
      properties:
        id:
          type: string
          format: uuid
          example: 883d5c1f-1999-45d8-a893-ced9e7e3bfae
        slug:
          type: string
          example: ta-la-truyen-hay
        name:
          type: string
          example: Ta Là Truyện Hay
        author:
          type: string
          example: Tác Giả Ẩn Danh
        poster:
          type: string
          nullable: true
          description: URL ảnh bìa
          example: https://cdn.truyenhay.com/covers/883d5c1f.jpg
        status:
          $ref: '#/components/schemas/StoryStatus'
        chapterCount:
          type: integer
          example: 120
        rating:
          type: number
          format: float
          example: 4.5
        nominations:
          type: integer
          example: 88
        categories:
          type: array
          items:
            type: string
          example: ["Huyền Huyễn", "Tu Tiên"]
        tags:
          type: array
          items:
            type: string
          example: ["harem", "mạnh-mẽ"]
        vip:
          type: boolean
          example: false
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T14:30:00.000Z"
      required: [id, slug, name, author, status, chapterCount, rating, nominations, categories, tags, vip]

    StoryResponse:
      allOf:
        - $ref: '#/components/schemas/StorySummary'
        - type: object
          properties:
            description:
              type: string
              example: Mô tả nội dung truyện...
            candyReceived:
              type: integer
              description: Tổng candy truyện đã nhận được (thống kê, không phải giá)
              example: 2340
            ratingCount:
              type: integer
              example: 230
            commentCount:
              type: integer
              example: 45
            postedBy:
              type: string
              format: uuid
              description: userId của người đăng truyện
              example: a1b2c3d4-1234-5678-abcd-ef0123456789
            createdAt:
              type: string
              format: date-time
              example: "2024-01-01T00:00:00.000Z"

    ChapterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: ch-001-uuid-1234-5678-abcd-ef0123456789
        storyId:
          type: string
          format: uuid
          example: 883d5c1f-1999-45d8-a893-ced9e7e3bfae
        number:
          type: integer
          example: 1
        title:
          type: string
          example: "Chương 1: Mở đầu"
        content:
          type: string
          nullable: true
          description: Nội dung chương — chỉ trả về khi user đã mở khoá hoặc chương miễn phí
          example: Nội dung chương truyện...
        price:
          type: integer
          description: Số candy cần để mở khoá, 0 = miễn phí
          example: 5
        wordCount:
          type: integer
          example: 2500
        views:
          type: integer
          example: 1200
        isUnlocked:
          type: boolean
          description: User hiện tại đã mở khoá chương này chưa
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-06-05T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-06-05T12:00:00.000Z"
      required: [id, storyId, number, title, price, wordCount, views, isUnlocked, createdAt]

    RatingResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: r1b2c3d4-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        storyId:
          type: string
          format: uuid
          example: 883d5c1f-1999-45d8-a893-ced9e7e3bfae
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        createdAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, userId, storyId, score, createdAt]

    CommentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: cm1b2c3d4-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        userName:
          type: string
          example: Nguyễn Văn A
        userAvatarUrl:
          type: string
          nullable: true
          example: https://cdn.truyenhay.com/avatars/a1b2c3d4.jpg
        storyId:
          type: string
          format: uuid
          example: 883d5c1f-1999-45d8-a893-ced9e7e3bfae
        content:
          type: string
          example: Truyện hay quá, mong tác giả ra chương mới sớm!
        createdAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, userId, userName, storyId, content, createdAt]

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: cat-uuid-1234-5678-abcd-ef0123456789
        name:
          type: string
          example: Huyền Huyễn
        slug:
          type: string
          example: huyen-huyen
        storyCount:
          type: integer
          example: 342
      required: [id, name, slug]

    TagResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: tag-uuid-1234-5678-abcd-ef0123456789
        name:
          type: string
          example: harem
        slug:
          type: string
          example: harem
        storyCount:
          type: integer
          example: 87
      required: [id, name, slug]

    CandyPackageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: pkg-uuid-1234-5678-abcd-ef0123456789
        name:
          type: string
          example: Gói 100 Kẹo
        priceVnd:
          type: integer
          description: Giá gói (VNĐ)
          example: 20000
        candyAmount:
          type: integer
          description: Số candy nhận được
          example: 100
        bonusCandy:
          type: integer
          description: Candy thưởng thêm
          example: 10
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
      required: [id, name, priceVnd, candyAmount, bonusCandy, isActive]

    PaymentOrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: ord-uuid-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        packageId:
          type: string
          format: uuid
          example: pkg-uuid-1234-5678-abcd-ef0123456789
        orderCode:
          type: string
          description: Mã đơn hàng — user ghi vào nội dung chuyển khoản để SePay match
          example: NOVEL240527A1B2
        amountVnd:
          type: integer
          description: Số tiền cần chuyển (VNĐ)
          example: 20000
        candyAmount:
          type: integer
          description: Số candy sẽ nhận sau khi thanh toán thành công
          example: 110
        status:
          $ref: '#/components/schemas/PaymentOrderStatus'
        expiredAt:
          type: string
          format: date-time
          description: Thời hạn thanh toán
          example: "2026-06-16T11:00:00.000Z"
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-06-16T10:00:00.000Z"
      required: [id, userId, packageId, orderCode, amountVnd, candyAmount, status, expiredAt, createdAt]

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: notif-uuid-1234-5678-abcd-ef0123456789
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-1234-5678-abcd-ef0123456789
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: Chương mới đã được đăng
        content:
          type: string
          example: "Truyện \"Ta Là Truyện Hay\" vừa ra Chương 121."
        isRead:
          type: boolean
          example: false
        referenceId:
          type: string
          format: uuid
          nullable: true
          description: ID tham chiếu (storyId, chapterId, orderId tùy loại)
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-06-16T08:00:00.000Z"
      required: [id, userId, type, title, content, isRead, createdAt]

    AdminStatsResponse:
      type: object
      properties:
        totalUsers:
          type: integer
          example: 15420
        totalStories:
          type: integer
          example: 842
        totalChapters:
          type: integer
          example: 98430
        totalRevenue:
          type: integer
          description: Tổng doanh thu (VNĐ)
          example: 125000000
        totalCandySold:
          type: integer
          description: Tổng candy đã bán
          example: 6250000
        newUsersToday:
          type: integer
          example: 87
        newStoriesThisMonth:
          type: integer
          example: 34
        pendingOrders:
          type: integer
          example: 12
      required: [totalUsers, totalStories, totalChapters, totalRevenue, totalCandySold, newUsersToday, newStoriesThisMonth, pendingOrders]

    # ── Request bodies ──

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: "securePass123"
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Nguyễn Văn A
        gender:
          $ref: '#/components/schemas/Gender'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: "securePass123"

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (15 phút)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'
      required: [accessToken, user]

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token mới (15 phút)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required: [accessToken]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Nguyễn Văn B
        gender:
          $ref: '#/components/schemas/Gender'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: "oldPass123"
        newPassword:
          type: string
          minLength: 6
          example: "newPass456"

    CreateStoryRequest:
      type: object
      required: [name, author, description, categoryIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Tên Truyện Mới
        author:
          type: string
          maxLength: 100
          example: Tác Giả ABC
        description:
          type: string
          example: Mô tả nội dung truyện...
        status:
          $ref: '#/components/schemas/StoryStatus'
        vip:
          type: boolean
          example: false
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
          example: ["cat-uuid-1234-5678-abcd-ef0123456789"]
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          example: []

    UpdateStoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          example: Tên Truyện Đã Sửa
        author:
          type: string
          maxLength: 100
          example: Tác Giả XYZ
        description:
          type: string
          example: Mô tả mới...
        status:
          $ref: '#/components/schemas/StoryStatus'
        vip:
          type: boolean
          example: true
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid

    CreateChapterRequest:
      type: object
      required: [number, title, content]
      properties:
        number:
          type: integer
          minimum: 1
          example: 1
        title:
          type: string
          maxLength: 200
          example: "Chương 1: Mở đầu"
        content:
          type: string
          example: Nội dung chương truyện đầy đủ...
        price:
          type: integer
          minimum: 0
          description: Số candy cần để mở khoá, mặc định 0
          example: 0

    UpdateChapterRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          example: "Chương 1: Mở đầu (đã sửa)"
        content:
          type: string
          example: Nội dung chương đã được cập nhật...
        price:
          type: integer
          minimum: 0
          example: 5

    RatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

    CommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          example: Truyện hay quá!

    CreatePaymentOrderRequest:
      type: object
      required: [packageId]
      properties:
        packageId:
          type: string
          format: uuid
          example: pkg-uuid-1234-5678-abcd-ef0123456789

    SepayWebhookRequest:
      type: object
      description: Payload từ SePay khi có giao dịch chuyển khoản vào
      required: [id, gateway, transactionDate, accountNumber, transferAmount, accumulated, content, referenceCode, transferType]
      properties:
        id:
          type: integer
          description: ID giao dịch trên hệ thống SePay (dùng làm gatewayTransactionId — idempotency key)
          example: 12345
        gateway:
          type: string
          description: Tên ngân hàng/cổng thanh toán
          example: MB
        transactionDate:
          type: string
          description: Thời gian giao dịch theo format "YYYY-MM-DD HH:mm:ss"
          example: "2024-01-15 14:30:00"
        accountNumber:
          type: string
          description: Số tài khoản nhận tiền
          example: "0123456789"
        subAccount:
          type: string
          nullable: true
          example: null
        transferAmount:
          type: number
          description: Số tiền giao dịch (VNĐ)
          example: 100000
        accumulated:
          type: number
          description: Số dư lũy kế
          example: 200000
        code:
          type: string
          nullable: true
          description: Mã nội dung giao dịch do SePay parse
          example: SEPAY123
        content:
          type: string
          description: Nội dung chuyển khoản đầy đủ
          example: "NOVEL240527A1B2 thanh toan"
        referenceCode:
          type: string
          description: Mã đơn hàng được parse từ nội dung (khớp với payment_orders.orderCode)
          example: NOVEL240527A1B2
        transferType:
          type: string
          enum: [in, out]
          description: Loại giao dịch — chỉ xử lý "in"
          example: in

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Khoa Học Viễn Tưởng
        slug:
          type: string
          description: Nếu không cung cấp sẽ tự động tạo từ name
          example: khoa-hoc-vien-tuong

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: isekai
        slug:
          type: string
          example: isekai

    AdminUpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/UserRole'
        gender:
          $ref: '#/components/schemas/Gender'
        recommendationTicket:
          type: integer
          minimum: 0
          example: 5

    AdminTopupRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Số candy cần cộng vào ví
          example: 100
        description:
          type: string
          example: Admin tặng candy

    CreateCandyPackageRequest:
      type: object
      required: [name, priceVnd, candyAmount]
      properties:
        name:
          type: string
          example: Gói 500 Kẹo
        priceVnd:
          type: integer
          minimum: 1000
          example: 100000
        candyAmount:
          type: integer
          minimum: 1
          example: 500
        bonusCandy:
          type: integer
          minimum: 0
          example: 50
        isActive:
          type: boolean
          example: true

    UpdateCandyPackageRequest:
      type: object
      properties:
        name:
          type: string
          example: Gói 500 Kẹo (Ưu Đãi)
        priceVnd:
          type: integer
          minimum: 1000
          example: 90000
        candyAmount:
          type: integer
          minimum: 1
          example: 500
        bonusCandy:
          type: integer
          minimum: 0
          example: 75
        isActive:
          type: boolean
          example: false


    # ── Pagination ──

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 842
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 43
      required: [total, page, limit, totalPages]

    # ── Error ──

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed
        error:
          type: string
          example: Bad Request
      required: [statusCode, message]

  # ── Responses ──

  responses:
    Unauthorized:
      description: Chưa xác thực — cần đăng nhập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Unauthorized
            error: Unauthorized

    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Forbidden resource
            error: Forbidden

    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            message: Resource not found
            error: Not Found

    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message: Validation failed
            error: Bad Request

  # ── Parameters ──

  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Số trang (bắt đầu từ 1)

    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Số item mỗi trang

    storyIdParam:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID của truyện

    chapterIdParam:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID của chương

# ─── PATHS ────────────────────────────────────────────────────────────────────

paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 409
                message: Email already exists
                error: Conflict

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công — refresh token gửi qua httpOnly cookie
          headers:
            Set-Cookie:
              description: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth/refresh
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Lấy access token mới bằng refresh token
      description: Refresh token được đọc từ httpOnly cookie "refreshToken". Trả về access token mới và rotate refresh token.
      security: []
      responses:
        '200':
          description: Refresh thành công
          headers:
            Set-Cookie:
              description: refreshToken mới (rotation)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — xoá refresh token khỏi Redis
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Users ─────────────────────────────────────────────────────────────────

  /users/me:
    get:
      tags: [Users]
      summary: Lấy thông tin profile hiện tại
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/profile:
    patch:
      tags: [Users]
      summary: Cập nhật profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile đã được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload ảnh đại diện
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: File ảnh (JPG, PNG, WebP — tối đa 2MB)
      responses:
        '200':
          description: Avatar đã được cập nhật
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    example: https://cdn.truyenhay.com/avatars/a1b2c3d4.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/change-password:
    patch:
      tags: [Users]
      summary: Đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/wallet:
    get:
      tags: [Users]
      summary: Lấy thông tin ví candy
      responses:
        '200':
          description: Thông tin ví
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/wallet/transactions:
    get:
      tags: [Users]
      summary: Lịch sử giao dịch candy
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/WalletTransactionType'
          description: Lọc theo loại giao dịch
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletTransactionResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'


  /users/me/bookmarks:
    get:
      tags: [Users]
      summary: Danh sách truyện đã bookmark
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Danh sách bookmark
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorySummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Users]
      summary: Bookmark một truyện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storyId]
              properties:
                storyId:
                  type: string
                  format: uuid
                  example: 883d5c1f-1999-45d8-a893-ced9e7e3bfae
      responses:
        '201':
          description: Bookmark thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Story bookmarked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Đã bookmark truyện này rồi

  /users/me/bookmarks/{storyId}:
    delete:
      tags: [Users]
      summary: Xoá bookmark
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xoá bookmark thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/reading-history:
    delete:
      tags: [Users]
      summary: Xoá toàn bộ lịch sử đọc
      responses:
        '200':
          description: Xoá lịch sử đọc thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reading history cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/daily-read:
    post:
      tags: [Users]
      summary: Ghi nhận đọc 1 chương (cập nhật dailyReadCount)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterId]
              properties:
                chapterId:
                  type: string
                  format: uuid
                  example: ch-001-uuid-1234-5678-abcd-ef0123456789
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  dailyReadCount:
                    type: integer
                    example: 8
                  dailyTicketClaimed:
                    type: boolean
                    example: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/daily-ticket/claim:
    post:
      tags: [Users]
      summary: Nhận vé đề cử hàng ngày (điều kiện đọc đủ số chương)
      responses:
        '200':
          description: Nhận vé thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Daily ticket claimed
                  recommendationTicket:
                    type: integer
                    example: 4
        '400':
          description: Chưa đủ điều kiện hoặc đã nhận rồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Notifications ──────────────────────────────────────────────────────────

  /notifications:
    get:
      tags: [Users]
      summary: Lấy danh sách thông báo
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - name: isRead
          in: query
          schema:
            type: boolean
          description: Lọc theo trạng thái đã đọc
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  unreadCount:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Đánh dấu tất cả thông báo là đã đọc
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All notifications marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Stories ───────────────────────────────────────────────────────────────

  /novels:
    get:
      tags: [Stories]
      summary: Lấy danh sách truyện (có filter + phân trang)
      security: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo tên truyện hoặc tác giả
          example: Đấu Phá
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StoryStatus'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
          description: Lọc theo thể loại
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
          description: Lọc theo tag
        - name: vip
          in: query
          schema:
            type: boolean
          description: Lọc truyện VIP / miễn phí
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [updatedAt, rating, nominations, chapterCount]
            default: updatedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: Danh sách truyện
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorySummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Stories]
      summary: Tạo truyện mới
      description: Yêu cầu đăng nhập. Admin có thể tạo truyện cho bất kỳ ai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
      responses:
        '201':
          description: Tạo truyện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /novels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID của truyện
    get:
      tags: [Stories]
      summary: Lấy chi tiết truyện
      security: []
      responses:
        '200':
          description: Chi tiết truyện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Stories]
      summary: Cập nhật truyện (chủ truyện hoặc admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Stories]
      summary: Xoá truyện (chủ truyện hoặc admin)
      responses:
        '200':
          description: Xoá thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /novels/{id}/nominate:
    post:
      tags: [Stories]
      summary: Đề cử truyện (UNIQUE per user per story — dùng 1 vé đề cử)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Đề cử thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Nomination submitted
                  remainingTickets:
                    type: integer
                    example: 2
        '400':
          description: Hết vé đề cử
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Đã đề cử truyện này rồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /novels/{id}/gift-candy:
    post:
      tags: [Stories]
      summary: Tặng kẹo cho truyện (trừ candy từ ví người dùng)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của truyện được tặng kẹo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                  description: ID người dùng tặng kẹo
                amount:
                  type: integer
                  minimum: 1
                  description: Số kẹo muốn tặng
              required: [userId, amount]
      responses:
        '200':
          description: Tặng kẹo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: object
                    properties:
                      userId:
                        type: string
                        format: uuid
                      balance:
                        type: integer
                        description: Số dư kẹo còn lại sau khi tặng
        '400':
          description: Số kẹo không hợp lệ hoặc số dư không đủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stories/{storyId}/ratings:
    parameters:
      - $ref: '#/components/parameters/storyIdParam'
    get:
      tags: [Stories]
      summary: Lấy danh sách đánh giá của truyện
      security: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RatingResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  averageScore:
                    type: number
                    format: float
                    example: 4.3
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Stories]
      summary: Đánh giá truyện (tạo hoặc cập nhật rating của user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '200':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /stories/{storyId}/comments:
    parameters:
      - $ref: '#/components/parameters/storyIdParam'
    get:
      tags: [Stories]
      summary: Lấy danh sách bình luận của truyện
      security: []
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: Danh sách bình luận
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Stories]
      summary: Đăng bình luận
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Bình luận đã được đăng
          content:
            application/json:
